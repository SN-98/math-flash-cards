<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ede2c8" />
  <title>Math Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <main id="app">
    <!-- Login screen -->
    <section id="screen-login" class="screen active">
      <div class="card login-card">
        <h1>Math Flashcards</h1>
        <p class="muted">Sign in with a username and your access code.</p>
        <form id="login-form">
          <label>
            <span>Username</span>
            <input id="login-username" type="text" autocomplete="username" required minlength="2" maxlength="32" />
          </label>
          <label>
            <span>Access code</span>
            <input id="login-code" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit" class="primary">Enter</button>
          <p id="login-error" class="error" hidden></p>
        </form>
      </div>
    </section>

    <!-- Home / mode picker -->
    <section id="screen-home" class="screen">
      <header class="topbar">
        <div>
          <div class="muted small">Signed in as</div>
          <div id="who" class="who"></div>
        </div>
        <button id="logout" class="ghost">Log out</button>
      </header>
      <div class="tabs">
        <button id="tab-quiz" class="tab active" type="button">Quiz</button>
        <button id="tab-learn" class="tab" type="button">Learn</button>
      </div>
      <h2 id="home-heading">Pick a quiz</h2>
      <p class="muted small" id="home-subhead">Type the answer; we'll re-quiz what you miss.</p>

      <section class="custom-picker" id="custom-picker">
        <div class="picker-label">Custom table mix</div>
        <div class="chip-row" id="table-chips"></div>
        <div class="picker-actions">
          <button class="picker-link" id="picker-all" type="button">All</button>
          <button class="picker-link" id="picker-clear" type="button">Clear</button>
          <button class="primary picker-go" id="picker-go" type="button" disabled>Quiz selected</button>
        </div>
      </section>

      <div id="mode-list" class="mode-list"></div>
      <section class="stats" id="stats-summary"></section>
    </section>

    <!-- Learn -->
    <section id="screen-learn" class="screen">
      <header class="topbar">
        <button id="learn-back" class="ghost">← Home</button>
        <div id="learn-progress" class="muted small"></div>
      </header>
      <div class="card learn-card" id="learn-card">
        <div class="topic-tag" id="learn-topic"></div>
        <div class="question" id="learn-question"></div>
        <div class="learn-answer" id="learn-answer"></div>
        <div class="card-actions">
          <button id="learn-prev" class="ghost">← Prev</button>
          <button id="learn-next" class="ghost">Next →</button>
        </div>
      </div>
      <p class="muted small hint">Tip: → next · ← previous · swipe on mobile</p>
    </section>

    <!-- Quiz -->
    <section id="screen-quiz" class="screen">
      <header class="topbar">
        <button id="quiz-back" class="ghost">← Home</button>
        <div id="quiz-progress" class="muted small"></div>
      </header>
      <div class="card quiz-card" id="quiz-card">
        <div class="topic-tag" id="quiz-topic"></div>
        <div class="question" id="quiz-question"></div>
        <form id="answer-form">
          <input id="answer-input" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Your answer" />
          <button type="submit" class="primary" id="answer-submit">Check</button>
        </form>
        <div id="feedback" class="feedback" hidden></div>
        <div class="card-actions">
          <button id="prev-btn" class="ghost">← Prev</button>
          <button id="next-btn" class="ghost">Next →</button>
        </div>
      </div>
      <p class="muted small hint">Tip: Enter to check · → next · ← previous · swipe on mobile</p>
    </section>

    <!-- Done -->
    <section id="screen-done" class="screen">
      <div class="card">
        <h2>Session complete 🎯</h2>
        <div id="done-summary"></div>
        <div class="card-actions">
          <button id="done-review" class="primary">Review wrong</button>
          <button id="done-home" class="ghost">Home</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Cache-buster: bump the version on every commit that touches js/css. -->
  <script src="js/config.js?v=8"></script>
  <script src="js/questions.js?v=8"></script>
  <script src="js/auth.js?v=8"></script>
  <script src="js/quiz.js?v=8"></script>
  <script src="js/app.js?v=8"></script>
</body>
</html>
